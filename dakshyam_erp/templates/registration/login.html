<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Login | Dakshyam Innovations ERP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-slate-800/40">
    <!-- Brand Header -->
    <div class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 p-8 text-center text-white">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-indigo-500 to-cyan-400 mx-auto flex items-center justify-center font-extrabold text-xl shadow-lg">
        DI
      </div>
      <h1 class="text-xl font-extrabold mt-4 tracking-tight">Dakshyam Innovations</h1>
      <p class="text-xs text-cyan-300 font-medium mt-1">Staff & Admin ERP Portal • Waraseoni</p>
    </div>

    <!-- Login Form -->
    <form method="post" action="{% url 'login' %}" class="p-8 space-y-5">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}" />

      {% if form.errors %}
        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-xs font-semibold">
          Invalid username or password. Please try again.
        </div>
      {% endif %}

      <div>
        <label for="id_username" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
          Username
        </label>
        <input type="text" name="username" id="id_username" required autofocus
               placeholder="Enter staff username"
               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition" />
      </div>

      <div>
        <label for="id_password" class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">
          Password
        </label>
        <input type="password" name="password" id="id_password" required
               placeholder="••••••••"
               class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition" />
      </div>

      <button type="submit"
              class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-bold shadow-md shadow-indigo-600/20 transition cursor-pointer">
        Sign In to Portal
      </button>
    </form>
  </div>

</body>
</html>
